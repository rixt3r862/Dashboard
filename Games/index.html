<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Game Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="../app.webmanifest" />
    <script defer src="../shared/pwa.js" data-sw="../sw.js"></script>
    <script src="../shared/app-catalog.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23155e4c%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-size=%2254%22>🎲</text></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23155e4c%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-size=%2254%22>🎲</text></svg>"
    />
    <link rel="stylesheet" href="../shared/category-launcher.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="../index.html">Dashboard</a> / Game Room
        </nav>
        <button id="themeToggle" class="theme-toggle" type="button">Toggle Theme</button>
      </header>
      <main>
        <h1><span aria-hidden="true">🎲</span> Game Room</h1>
        <section class="shortcut-section" aria-labelledby="favoritesTitle">
          <div class="section-head"><h2 id="favoritesTitle">Favorites</h2><span id="favoriteCount" class="count">0</span></div>
          <div id="favorites" class="shortcut-list"></div>
          <p id="favoritesEmpty" class="empty">No favorites yet.</p>
        </section>
        <section class="shortcut-section" aria-labelledby="activityTitle">
          <h2 id="activityTitle">Continue Playing</h2>
          <div id="activity" class="shortcut-list"></div>
          <p id="activityEmpty" class="empty">No games in progress.</p>
        </section>
        <h2 class="apps-heading">All Games</h2>
        <div id="appsGrid" class="apps-grid"></div>
        <p id="launcherStatus" role="status"></p>
      </main>
    </div>
    <script src="../shared/category-launcher.js"></script>
    <script>
      const GAME_APPS = window.DashboardCatalog.forCategory("games");
      window.CategoryLauncher.init("games", GAME_APPS);
    </script>
  </body>
</html>
