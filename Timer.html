<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="./app.webmanifest" />
  <script defer src="./shared/pwa.js" data-sw="./sw.js"></script>
  <title>Progress Bar Timer</title>
  <script src="./shared/utility-shell.js"></script>
  <style>
    :root{
      --bg: #0b0f14;
      --bg-glow: #0f172a;
      --panel: #121823;
      --accent: #4f8cff;
      --accent-2:#22c55e;
      --text: #e6eefb;
      --muted:#8aa0bd;
      --bar-bg:#1e293b;
      --bar-fill: linear-gradient(90deg, #60a5fa, #34d399);
      --ring:#2b384d;
      --danger:#ef4444;
      --surface: rgba(255,255,255,.03);
      --surface-border: rgba(255,255,255,.08);
      --input-bg:#0f1520;
      --input-border: rgba(255,255,255,.1);
      --secondary-bg:#223049;
      --secondary-text:#dbe7ff;
      --ghost-text:#c7d6f5;
      --ghost-border:#2b3a53;
      --tick: rgba(255,255,255,.06);
      --ring-rest:#172034;
      --ring-center:#0f1520;
      --preset-bg:#162236;
      --preset-text:#b7c9eb;
      --preset-border:#24344f;
      --preset-border-hover:#35507d;
      --back-border: rgba(255,255,255,.14);
      --back-bg:#1a2333;
      --back-hover:#223049;
      --link:#90c2ff;
    }
    :root[data-theme="light"]{
      --bg: #eef2f7;
      --bg-glow: #dce6f5;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-2:#16a34a;
      --text: #0f172a;
      --muted:#475569;
      --bar-bg:#e2e8f0;
      --bar-fill: linear-gradient(90deg, #3b82f6, #22c55e);
      --ring:#cbd5e1;
      --danger:#dc2626;
      --surface: rgba(15,23,42,.03);
      --surface-border: rgba(15,23,42,.1);
      --input-bg:#f8fafc;
      --input-border: rgba(15,23,42,.15);
      --secondary-bg:#e2e8f0;
      --secondary-text:#0f172a;
      --ghost-text:#334155;
      --ghost-border:#cbd5e1;
      --tick: rgba(15,23,42,.06);
      --ring-rest:#cfd8e6;
      --ring-center:#f8fafc;
      --preset-bg:#e2e8f0;
      --preset-text:#1e293b;
      --preset-border:#cbd5e1;
      --preset-border-hover:#94a3b8;
      --back-border: rgba(15,23,42,.18);
      --back-bg:#ffffff;
      --back-hover:#f1f5f9;
      --link:#2563eb;
    }
    :root[data-theme="dark"]{
      --bg: #0b0f14;
      --bg-glow: #0f172a;
      --panel: #121823;
      --accent: #4f8cff;
      --accent-2:#22c55e;
      --text: #e6eefb;
      --muted:#8aa0bd;
      --bar-bg:#1e293b;
      --bar-fill: linear-gradient(90deg, #60a5fa, #34d399);
      --ring:#2b384d;
      --danger:#ef4444;
      --surface: rgba(255,255,255,.03);
      --surface-border: rgba(255,255,255,.08);
      --input-bg:#0f1520;
      --input-border: rgba(255,255,255,.1);
      --secondary-bg:#223049;
      --secondary-text:#dbe7ff;
      --ghost-text:#c7d6f5;
      --ghost-border:#2b3a53;
      --tick: rgba(255,255,255,.06);
      --ring-rest:#172034;
      --ring-center:#0f1520;
      --preset-bg:#162236;
      --preset-text:#b7c9eb;
      --preset-border:#24344f;
      --preset-border-hover:#35507d;
      --back-border: rgba(255,255,255,.14);
      --back-bg:#1a2333;
      --back-hover:#223049;
      --link:#90c2ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 900px at 80% -10%, var(--bg-glow), var(--bg));
      color:var(--text);
      display:grid;
      place-items:center;
      min-height: 100dvh;
      padding:
        calc(env(safe-area-inset-top, 0px) + 56px)
        24px
        max(24px, env(safe-area-inset-bottom, 0px));
    }
    .app{
      width:min(760px, 100%);
      background:linear-gradient(180deg, var(--surface), transparent 120px), var(--panel);
      border:1px solid var(--surface-border);
      border-radius:24px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      padding:24px;
    }
    header{display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px}
    h1{font-size:20px; margin:0; letter-spacing:.3px}
    .sub{color:var(--muted); font-size:12px}

    .grid{display:grid; grid-template-columns: 1fr; gap:16px}
    @media (min-width: 640px){
      .grid{grid-template-columns: 1fr 1fr}
    }

    .card{
      background: var(--surface);
      border:1px solid var(--surface-border);
      border-radius:18px;
      padding:16px;
    }

    label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px}
    .inputs{display:flex; gap:12px}
    .inputs input{
      appearance:textfield;
      width:100%;
      padding:14px 12px;
      border-radius:12px;
      border:1px solid var(--input-border);
      background:var(--input-bg);
      color:var(--text);
      font-size:16px;
      outline:none;
      transition:border-color .2s ease;
    }
    .inputs input:focus{border-color: var(--accent)}
    .inputs .unit{position:relative; flex:1}
    .inputs .unit span{
      position:absolute; right:10px; top:50%; translate:0 -50%;
      color:var(--muted); font-size:12px; pointer-events:none
    }

    .btns{display:flex; flex-wrap:wrap; gap:10px}
    button{
      appearance:none; border:0; cursor:pointer; padding:12px 16px; border-radius:12px;
      background: var(--accent); color:white; font-weight:600; letter-spacing:.2px;
      box-shadow: 0 6px 20px rgba(79,140,255,.35);
      transition: transform .08s ease, filter .2s ease, background .2s ease;
    }
    button.secondary{background:var(--secondary-bg); color:var(--secondary-text); box-shadow:none; border:1px solid var(--surface-border)}
    button.ghost{background:transparent; color:var(--ghost-text); border:1px dashed var(--ghost-border)}
    button.danger{background:var(--danger)}
    button:disabled{opacity:.55; filter:saturate(.7); cursor:not-allowed}
    button:active{transform: translateY(1px)}

    .progress-wrap{display:grid; gap:10px}
    .progress{
      height:20px; border-radius:999px; background:var(--bar-bg); overflow:hidden; position:relative;
      border:1px solid var(--surface-border);
    }
    .progress .fill{
      height:100%; width:0%; background: var(--bar-fill);
      transition: width .1s linear;
    }
    .progress .tick{
      position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, transparent 0 24px, var(--tick) 24px 25px);
      pointer-events:none;
    }
    .meta{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:14px}
    .meta strong{color:var(--text); letter-spacing:.4px}

    .ring{
      --size: 120px;
      width:var(--size); height:var(--size); border-radius:50%; position:relative; display:grid; place-items:center;
      background: conic-gradient(var(--accent) var(--angle,0deg), var(--ring-rest) 0deg);
      transition: background .2s linear;
      margin:auto;
    }
    .ring::before{
      content:""; position:absolute; inset:8px; border-radius:50%; background: var(--ring-center); box-shadow: inset 0 0 0 1px var(--ring);
    }
    .ring .tt{position:relative; font-weight:700}

    .presets{display:flex; gap:8px; flex-wrap:wrap}
    .preset{background:var(--preset-bg); color:var(--preset-text); border:1px solid var(--preset-border); padding:8px 10px; border-radius:10px; font-size:13px; cursor:pointer}
    .preset:hover{border-color:var(--preset-border-hover)}
    .back-link{
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      left: 12px;
      z-index: 10;
      padding: .45rem .75rem;
      border-radius: .6rem;
      border: 1px solid var(--back-border);
      background: var(--back-bg);
      color: var(--text);
      text-decoration: none;
      font-size: .9rem;
    }
    .back-link:hover{ background:var(--back-hover); }

    footer{margin-top:16px; color:var(--muted); font-size:12px; text-align:center}
    a { color:var(--link) }
  </style>
  <link rel="stylesheet" href="./shared/utility-shell.css" />
</head>
<body class="utility-page">
  <nav class="utility-nav" aria-label="Utility navigation">
    <div class="utility-nav-row">
      <a href="./index.html">Dashboard</a>
      <a href="./TimeTools/index.html">Time Tools</a>
      <label for="utilityTheme">Theme
        <select id="utilityTheme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
    </div>
    <p id="utilityStatus" class="utility-status" role="status" aria-live="polite"></p>
  </nav>

  <div class="app" role="application" aria-label="Progress bar timer">
    <header>
      <div>
        <h1>Progress Bar Timer</h1>
        <div class="sub">Set a duration, then start. The bar fills to 100% and the timer ends.</div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <label for="mins">Duration</label>
        <div class="inputs" >
          <div class="unit"><input id="mins" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="Minutes"><span>min</span></div>
          <div class="unit"><input id="secs" type="number" min="0" max="59" step="1" value="30" inputmode="numeric" aria-label="Seconds"><span>sec</span></div>
        </div>

        <div class="presets" style="margin-top:12px">
          <button class="preset" data-sec="10">10s</button>
          <button class="preset" data-sec="30">30s</button>
          <button class="preset" data-sec="60">1m</button>
          <button class="preset" data-sec="300">5m</button>
          <button class="preset" data-sec="600">10m</button>
        </div>
      </section>

      <section class="card">
        <div class="ring" aria-hidden="true"><div class="tt" id="timeLabel">00:30</div></div>
        <div class="btns" style="margin-top:14px">
          <button id="startBtn">Start</button>
          <button id="pauseBtn" class="secondary" disabled>Pause</button>
          <button id="resetBtn" class="ghost" disabled>Reset</button>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:16px">
      <div class="progress-wrap">
        <div class="meta">
          <div>Progress: <strong id="percentLabel">0%</strong></div>
          <div>Remaining: <strong id="remainingLabel">00:30</strong></div>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Time progress">
          <div class="fill" id="bar"></div>
          <div class="tick"></div>
        </div>
      </div>
    </section>

    <section class="timer-presets">
      <h2>Named Presets</h2>
      <div class="preset-controls">
        <label>Name <input id="presetName" maxlength="80" type="text"></label>
        <button id="savePreset" type="button">Save Preset</button>
        <label>Saved presets <select id="savedPresets"><option value="">Choose a preset</option></select></label>
        <button id="loadPreset" type="button" disabled>Load</button>
        <button id="deletePreset" type="button" disabled>Delete</button>
      </div>
      <p id="presetStatus" role="status" aria-live="polite"></p>
    </section>
    <div class="btns"><button id="testAlarm" type="button" class="secondary">Test Alarm</button></div>
    <p id="timerStatus" role="status" aria-live="polite"></p>
  </div>

  <style>
    .timer-presets { margin: 20px 0; padding-top: 16px; border-top: 1px solid var(--surface-border); }
    .timer-presets h2 { font-size: 18px; margin: 0 0 12px; }
    .preset-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
    .preset-controls label { display: grid; gap: 4px; flex: 1 1 160px; min-width: 0; }
    .preset-controls input, .preset-controls select { box-sizing: border-box; width: 100%; min-width: 0; min-height: 38px; font: inherit; }
    #timerStatus, #presetStatus { overflow-wrap: anywhere; }
    #timeLabel { font-size: 28px; }
  </style>
  <script src="./shared/timer-state.js"></script>
  <script src="./shared/timer.js"></script>
</body>
</html>
